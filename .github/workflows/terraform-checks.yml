name: Terraform checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['modules/**', 'workloads/prod/**', 'tools/**', '.gitignore', '.github/workflows/terraform-*.yml']
  push:
    branches: [main, feature/all-public-modules]
    paths: ['modules/**', 'workloads/prod/**', 'tools/**', '.gitignore', '.github/workflows/terraform-*.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        layer: [cache, registry, secrets, identity, argocd]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - name: Test deployment safeguards
        run: python -m unittest discover -s tools/tests -v
      - name: Format, validate and test without cloud credentials
        run: python tools/check_terraform.py --layer '${{ matrix.layer }}'
