name: Production Terraform

on:
  pull_request:
    paths:
      - "workloads/prod/**"
      - "modules/**"
      - "tools/**"
      - ".github/workflows/terraform-prod.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the saved plan after production approval
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/terraform_pipeline.py validate

  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - name: Write production inputs
        env:
          TFVARS_HCL: ${{ secrets.PROD_TFVARS_HCL }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          values = os.environ["TFVARS_HCL"]
          if not values.strip():
              raise SystemExit("Configure PROD_TFVARS_HCL before planning")
          Path("workloads/prod/terraform.tfvars").write_text(values, encoding="utf-8")
          PY
      - run: python tools/terraform_pipeline.py plan --var-file workloads/prod/terraform.tfvars
      - uses: actions/upload-artifact@v4
        with:
          name: production-plan
          path: artifacts/prod.tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    if: inputs.apply && github.ref == 'refs/heads/main'
    needs: plan
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      - uses: actions/download-artifact@v4
        with:
          name: production-plan
          path: artifacts
      - run: python tools/terraform_pipeline.py apply
