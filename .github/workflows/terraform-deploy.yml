name: Terraform deployment
on:
  workflow_dispatch:
    inputs:
      layer:
        description: Independent deployment root
        required: true
        type: choice
        options: [cache, registry, secrets, identity, argocd]
      operation:
        description: Plan only, or plan followed by environment-gated apply
        required: true
        default: plan
        type: choice
        options: [plan, apply]
permissions:
  contents: read
concurrency:
  group: terraform-${{ inputs.layer }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - name: Test deployment safeguards
        run: python -m unittest discover -s tools/tests -v
      - name: Validate selected module and deployment root
        run: python tools/check_terraform.py --layer '${{ inputs.layer }}'
  plan:
    outputs:
      artifact-id: ${{ steps.upload-plan.outputs.artifact-id }}
    needs: checks
    if: github.ref == 'refs/heads/main'
    # Give this private-network runner label only to trusted, isolated runners.
    runs-on: ${{ fromJSON(inputs.layer == 'argocd' && '["self-hosted","linux","x64","gke-private"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: tf-plan-${{ inputs.layer }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: workloads/prod/${{ inputs.layer }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - name: Check configured identity and backend mode
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          TF_SERVICE_ACCOUNT: ${{ vars.TF_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          test -n "$WIF_PROVIDER" && test -n "$TF_SERVICE_ACCOUNT" && test -n "$GCP_PROJECT_ID"
          test ! -e backend_override.tf
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        if: inputs.layer == 'argocd'
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Load environment configuration
        env:
          TFVARS_HCL: ${{ secrets.TFVARS_HCL }}
          BACKEND_HCL: ${{ secrets.BACKEND_HCL }}
        run: |
          test -n "$TFVARS_HCL" && test -n "$BACKEND_HCL"
          printf '%s\n' "$TFVARS_HCL" > terraform.tfvars
          printf '%s\n' "$BACKEND_HCL" > backend.hcl
      - name: Plan
        env:
          EXPECTED_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform validate
          terraform plan -input=false -lock-timeout=5m -out=deployment.tfplan
          terraform show -json deployment.tfplan > plan.json
          terraform show -no-color deployment.tfplan > plan.txt
          python ../../../tools/plan_manifest.py create --layer "${{ inputs.layer }}" --commit "$GITHUB_SHA" --project "$EXPECTED_PROJECT_ID"
          { echo '### Terraform plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - id: upload-plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terraform-${{ inputs.layer }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            workloads/prod/${{ inputs.layer }}/deployment.tfplan
            workloads/prod/${{ inputs.layer }}/plan-manifest.json
            workloads/prod/${{ inputs.layer }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Remove local plan and configuration files
        if: always()
        run: rm -f terraform.tfvars backend.hcl deployment.tfplan plan.txt plan.json plan-manifest.json
  apply:
    if: inputs.operation == 'apply'
    needs: plan
    runs-on: ${{ fromJSON(inputs.layer == 'argocd' && '["self-hosted","linux","x64","gke-private"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    environment: tf-apply-${{ inputs.layer }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: workloads/prod/${{ inputs.layer }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - name: Check configured identity and backend mode
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          TF_SERVICE_ACCOUNT: ${{ vars.TF_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          test -n "$WIF_PROVIDER" && test -n "$TF_SERVICE_ACCOUNT" && test -n "$GCP_PROJECT_ID"
          test ! -e backend_override.tf
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        if: inputs.layer == 'argocd'
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Check plan artifact ID
        env:
          PLAN_ARTIFACT_ID: ${{ needs.plan.outputs.artifact-id }}
        run: '[[ "$PLAN_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact-id }}
          merge-multiple: true
          path: workloads/prod/${{ inputs.layer }}
      - name: Apply the reviewed plan
        env:
          EXPECTED_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BACKEND_HCL: ${{ secrets.BACKEND_HCL }}
        run: |
          test -n "$BACKEND_HCL"
          printf '%s\n' "$BACKEND_HCL" > backend.hcl
          python ../../../tools/plan_manifest.py verify --layer "${{ inputs.layer }}" --commit "$GITHUB_SHA" --project "$EXPECTED_PROJECT_ID"
          terraform init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform apply -input=false -lock-timeout=5m deployment.tfplan
      - name: Remove local plan and configuration files
        if: always()
        run: rm -f terraform.tfvars backend.hcl deployment.tfplan plan.txt plan.json plan-manifest.json
